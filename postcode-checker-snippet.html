<!-- ==========================================================================
     4 PAW FRIEND - POSTCODE COVERAGE CHECKER
     Paste this whole block where you want it to appear.
     Self-contained. All class names prefixed "pc-". No build step.
     Coverage lists are in the EDIT HERE block near the bottom.
     ========================================================================== -->

<style>
.pc-section{background:#0000FF;padding:56px 40px;position:relative;overflow:hidden;font-family:'Open Sans',Arial,Helvetica,sans-serif}
.pc-paw{position:absolute;color:#FFFF00;opacity:.05;font-size:200px;pointer-events:none;line-height:1;bottom:-50px;right:20px}
.pc-inner{max-width:700px;margin:0 auto;position:relative;z-index:1;text-align:center}
.pc-tag{font-family:'Montserrat',Arial,sans-serif;font-size:11px;font-weight:900;color:#FFFF00;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
.pc-inner h2{font-family:'Montserrat',Arial,sans-serif;font-size:34px;font-weight:900;color:#FFFF00;margin:0 0 10px;line-height:1.2}
.pc-sub{font-size:16px;color:rgba(255,255,255,.85);margin:0 0 26px;line-height:1.6}
.pc-form{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:0}
.pc-input{font-family:'Montserrat',Arial,sans-serif;font-size:17px;font-weight:700;padding:16px 22px;border-radius:28px;border:3px solid #FFFF00;background:#fff;color:#0000BB;width:260px;text-transform:uppercase;letter-spacing:1px}
.pc-input::placeholder{color:#99c;font-weight:600;letter-spacing:0}
.pc-input:focus{outline:3px solid #fff;outline-offset:2px}
.pc-btn{background:#FFFF00;color:#0000BB;font-family:'Montserrat',Arial,sans-serif;font-weight:900;font-size:16px;padding:16px 38px;border-radius:28px;border:none;letter-spacing:1px;cursor:pointer;white-space:nowrap}
.pc-btn:hover{background:#fff}
.pc-btn:disabled{opacity:.6;cursor:default}
.pc-btn:focus{outline:3px solid #fff;outline-offset:2px}
.pc-result{margin-top:24px;border-radius:14px;padding:22px 26px;text-align:left;display:flex;gap:16px;align-items:flex-start;font-size:15px;line-height:1.65}
.pc-result[hidden]{display:none}
.pc-ico{font-size:30px;line-height:1;flex-shrink:0}
.pc-result strong{font-family:'Montserrat',Arial,sans-serif;font-size:19px;font-weight:900;display:block;margin-bottom:5px}
.pc-yes{background:#FFFF00;color:#0000AA}
.pc-yes strong{color:#0000BB}
.pc-maybe{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,0,.5);color:rgba(255,255,255,.9)}
.pc-maybe strong{color:#FFFF00}
.pc-no{background:rgba(255,255,255,.09);border:1.5px solid rgba(255,255,255,.3);color:rgba(255,255,255,.85)}
.pc-no strong{color:#FFFF00}
.pc-cta{display:inline-block;margin-top:12px;background:#FFFF00;color:#0000BB;font-family:'Montserrat',Arial,sans-serif;font-weight:900;font-size:14px;padding:12px 26px;border-radius:24px;text-decoration:none;letter-spacing:1px}
.pc-yes .pc-cta{background:#0000FF;color:#FFFF00}
.pc-areas{margin-top:22px;font-size:13px;color:rgba(255,255,255,.55);line-height:1.8}
@media(max-width:640px){
  .pc-section{padding:44px 22px}
  .pc-inner h2{font-size:26px}
  .pc-input,.pc-btn{width:100%}
}
</style>

<section class="pc-section" id="areas">
  <div class="pc-paw">&#128062;</div>
  <div class="pc-inner">
    <div class="pc-tag">&#128205; Check Your Area</div>
    <h2>Do we cover your postcode?</h2>
    <p class="pc-sub">Pop your postcode in below and find out straight away whether we walk in your area.</p>

    <form class="pc-form" id="pcForm" novalidate>
      <label for="pcInput" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">Your postcode</label>
      <input class="pc-input" id="pcInput" type="text" placeholder="e.g. SW9 8AB" autocomplete="postal-code" maxlength="9" spellcheck="false">
      <button class="pc-btn" id="pcBtn" type="submit">CHECK NOW &#8594;</button>
    </form>

    <div class="pc-result" id="pcResult" role="status" aria-live="polite" hidden></div>

    <div class="pc-areas" id="pcAreas"></div>
  </div>
</section>

<script>
(function(){
  // ===== EDIT HERE ==========================================================
  // Districts taken from the coverage maps: Pimlico, Nine Elms/Vauxhall, SE1
  // (Waterloo/Borough), Kennington, Stockwell, Brixton, Clapham, Battersea,
  // Balham, Camberwell. Every one below also has live clients in it.
  var COVERED = ['SW1V','SW1P','SW8','SW11','SW4','SW9','SW2','SW12','SE1','SE11','SE5'];

  // Bordering districts - not on the maps, but you have clients in each, so
  // they get "get in touch" rather than a flat no. Move or delete as you like.
  var NEARBY  = ['SE16','SE15','SE17','SE24','SE27','SW16','SW17','SW18','SW1W','SW3'];

  var BOOK_URL    = 'https://book.4pawfriend.co.uk';
  var CONTACT_URL = '#contact';
  // ==========================================================================

  var form   = document.getElementById('pcForm');
  var input  = document.getElementById('pcInput');
  var result = document.getElementById('pcResult');
  var areas  = document.getElementById('pcAreas');
  if(!form || !input || !result) return;

  areas.textContent = 'Covering Pimlico, Vauxhall, Nine Elms, Waterloo, Borough, Kennington, Stockwell, Brixton, Clapham, Battersea, Balham & Camberwell';

  // Reduce a typed postcode to its outward code: "sw9 8ab" / "SW98AB" -> "SW9".
  function outward(raw){
    var s = (raw || '').toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(!s) return '';
    if(s.length > 3 && /[0-9][A-Z]{2}$/.test(s)) s = s.slice(0,-3);
    return /^[A-Z]{1,2}[0-9][A-Z0-9]?$/.test(s) ? s : '';
  }

  function show(cls, icon, title, body, ctaText, ctaHref){
    result.className = 'pc-result ' + cls;
    result.innerHTML = '';
    var ico = document.createElement('div');
    ico.className = 'pc-ico'; ico.textContent = icon;
    var wrap = document.createElement('div');
    var h = document.createElement('strong'); h.textContent = title;
    wrap.appendChild(h);
    wrap.appendChild(document.createTextNode(body));
    if(ctaText){
      var a = document.createElement('a');
      a.className = 'pc-cta'; a.href = ctaHref; a.textContent = ctaText;
      wrap.appendChild(document.createElement('br'));
      wrap.appendChild(a);
    }
    result.appendChild(ico); result.appendChild(wrap);
    result.hidden = false;
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var code = outward(input.value);
    if(!code){
      show('pc-no','\u26A0\uFE0F','That doesn\u2019t look like a postcode',
           'Try just the first part \u2014 for example SW9 or SE11.');
    } else if(COVERED.indexOf(code) !== -1){
      show('pc-yes','\u2705','Yes \u2014 we cover ' + code + '!',
           'Great news, ' + code + ' is right in our patch. We pick up and drop off from your front door.',
           'BOOK NOW \u2192', BOOK_URL);
    } else if(NEARBY.indexOf(code) !== -1){
      show('pc-maybe','\uD83D\uDCCD', code + ' is just outside our usual round',
           'We can sometimes stretch a little further depending on the day. Get in touch and we\u2019ll tell you honestly whether we can help.',
           'GET IN TOUCH \u2192', CONTACT_URL);
    } else {
      show('pc-no','\uD83D\uDC15','We don\u2019t currently cover ' + code,
           'That\u2019s outside the area we walk \u2014 but we\u2019re growing all the time, so do drop us a message.',
           'GET IN TOUCH \u2192', CONTACT_URL);
    }
  });

  input.addEventListener('input', function(){ result.hidden = true; });
})();
</script>
